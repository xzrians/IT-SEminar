<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Glowing Circuit Ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#brandGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6" filter="url(#glow)" />

  <!-- Center Microchip / AI Core Badge -->
  <rect x="146" y="146" width="220" height="220" rx="36" fill="#0d121f" stroke="url(#brandGrad)" stroke-width="8" filter="url(#glow)" />

  <!-- Processor Circuit Pins -->
  <path d="M 210 146 L 210 110 M 256 146 L 256 110 M 302 146 L 302 110" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <path d="M 210 366 L 210 402 M 256 366 L 256 402 M 302 366 L 302 402" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />
  <path d="M 146 210 L 110 210 M 146 256 L 110 256 M 146 302 L 110 302" stroke="#00f2fe" stroke-width="6" stroke-linecap="round" />
  <path d="M 366 210 L 402 210 M 366 256 L 402 256 M 366 302 L 402 302" stroke="#a855f7" stroke-width="6" stroke-linecap="round" />

  <!-- Inner Spark / AI Symbol -->
  <path d="M 256 195 L 275 238 L 317 256 L 275 274 L 256 317 L 237 274 L 195 256 L 237 238 Z" fill="url(#brandGrad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#ffffff" />
</svg>

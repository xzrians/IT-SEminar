<!-- Offline Notification Banner (Shown when disconnected from network) -->
<div class="offline-banner" id="offlineBanner" style="display: none;" role="alert">
  <div class="container">
    <div class="offline-banner-content">
      <div class="offline-icon-badge">
        <i data-lucide="wifi-off"></i>
      </div>
      <div class="offline-text">
        <strong>Mod Luar Talian Aktif:</strong> Anda sedang melayari cache peranti. Semua maklumat modul, kuiz, jadual & senarai semak kekal boleh diakses 100%!
      </div>
      <button type="button" class="btn-dismiss-offline" onclick="dismissOfflineBanner()" aria-label="Tutup notifikasi">
        <i data-lucide="x"></i>
      </button>
    </div>
  </div>
</div>

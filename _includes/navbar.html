<!-- Sticky Master Navigation with PWA Status & Hub Navigation -->
<div class="navbar-wrapper">
  <div class="container">
    <nav class="navbar">
      <a href="{{ '/' | relative_url }}" class="nav-brand" style="text-decoration: none; color: inherit;">
        <div class="brand-icon">
          <i data-lucide="cpu"></i>
        </div>
        <div>
          <span class="brand-title">NextGen Tech Summit</span>
          <span class="brand-subtitle">UTM x ASDAF 2026</span>
        </div>
      </a>

      <!-- Desktop Hub Navigation Bar -->
      <div class="nav-menu" id="navMenu">
        <button type="button" class="nav-link active" id="desk-nav-home" onclick="switchHub('home')">
          <i data-lucide="home"></i> <span>Utama</span>
        </button>
        <button type="button" class="nav-link" id="desk-nav-timeline" onclick="switchHub('timeline')">
          <i data-lucide="calendar-clock"></i> <span>Jadual & Modul</span>
        </button>
        <button type="button" class="nav-link" id="desk-nav-people" onclick="switchHub('people')">
          <i data-lucide="users"></i> <span>7 Meja & Kru</span>
        </button>
        <button type="button" class="nav-link" id="desk-nav-ops" onclick="switchHub('ops')">
          <i data-lucide="check-square"></i> <span>Logistik & Ops</span>
        </button>
        <a href="https://github.com/xzrians/IT-SEminar/blob/main/GUIDELINE.md" target="_blank" class="nav-link wiki-link" style="color: var(--accent-cyan);">
          <i data-lucide="help-circle"></i> <span>Wiki</span>
        </a>
      </div>

      <!-- Action Items: Network Status, PWA Install & Print -->
      <div class="nav-actions">
        <!-- Live Online / Offline Status Pill -->
        <div class="network-status-pill online" id="networkStatusPill" title="Status Sambungan">
          <span class="status-dot"></span>
          <span class="status-text" id="networkStatusText">Online</span>
        </div>

        <!-- PWA Install Button (Appears when install prompt available) -->
        <button class="btn-install-pwa" id="btnInstallPwa" style="display: none;" onclick="promptPwaInstall()" title="Pasang ke Skrin Utama">
          <i data-lucide="download"></i>
          <span>Pasang</span>
        </button>

        <!-- Print Document -->
        <button class="btn-print" onclick="window.print()" title="Cetak Pelan Operasi (PDF)">
          <i data-lucide="printer"></i>
          <span class="print-text">PDF</span>
        </button>
      </div>
    </nav>
  </div>
</div>

# NextGen Celik Digital 2026 | UTM x ASDAF PERKIM

modules:
  - id: 1
    code: "MODUL-01"
    title: "Teknologi Talk: “Teknologi di Sekeliling Kita” & Cabaran Kuiz"
    time: "09:15 - 10:00 (45 Minit)"
    trainer: "Lead Trainer AI & Fasilitator UTM"
    focus: "Pengenalan ringkas dan santai mengenai AI, telefon pintar, media sosial, robot, serta kesedaran keselamatan siber dalam kehidupan seharian, diikuti kuiz interaktif."
    learning_outcomes:
      - "Mengenal aplikasi teknologi & AI dalam kehidupan harian (ChatGPT, Google, TikTok, Robotik)."
      - "Menyedari peranti dan algoritma yang berinteraksi dengan kita setiap hari."
      - "Menyertai cabaran kuiz teknologi dewan tanpa telefon dengan semangat kesukanan."

  - id: 2
    code: "MODUL-02"
    title: "Sesi “Bijak Melayari Internet” & Amali Kertas Mahjong"
    time: "10:15 - 11:50 (95 Minit)"
    trainer: "Trainer Keselamatan Siber & 7 Mentor Meja"
    focus: "Pendedahan asas keselamatan siber (scam, password, buli siber, privasi), aktiviti kertas mahjong memilih aplikasi AI dan kebaikannya, serta pembentangan kumpulan."
    learning_outcomes:
      - "Mengenal pasti penipuan dalam talian (scam), pautan palsu, dan teknik cipta kata laluan kebal."
      - "Memahami etika media sosial dan cara menangani buli siber."
      - "Aktiviti kertas mahjong: Setiap meja memilih 1 aplikasi AI, melukis & menyenaraikan kebaikannya, lalu membentangkan dalam 2 minit."

presentation_slides:
  deck_title: "NextGen Celik Digital: Menembusi Dunia Digital Santai"
  total_slides: 16
  slides:
    - slide_no: 1
      title: "Selamat Datang ke NextGen Celik Digital 2026!"
      section: "Pembukaan"
      visual: "Logo animasi UTM x ASDAF, visual futuristik neon ceria, gelombang suara lofi."
      speaker_notes: "Beri salam semangat, panggil adik-adik dengan mesra. Maklumkan bahawa hari ini bukan kuliah bosan, tetapi ekspedisi meneroka dunia masa depan bersama abang & kakak UTM."
    
    - slide_no: 2
      title: "Siapakah Kami? Abang & Kakak Fakulti Komputeran UTM"
      section: "Pengenalan"
      visual: "Gambar santai 13 kru UTM, peta perjalanan dari kampus Skudai/KL ke Bukit Persekutuan."
      speaker_notes: "Perkenalkan setiap peranan secara santai. Tekankan bahawa mahasiswa universiti datang sebagai rakan mentor untuk menyokong impian mereka."

    - slide_no: 3
      title: "Apakah Itu AI Sebenarnya? Robot Jahat atau Pembantu Pintar?"
      section: "Modul 1: Asas AI"
      visual: "Perbandingan imej: Robot fiksyen filem vs AI sebenar dalam telefon pintar (Siri, Google Maps, YouTube recommendation)."
      speaker_notes: "Tanya audiens: 'Bila dengar perkataan AI, apa yang terlintas? Terminator?'. Jelaskan AI sebenarnya adalah program matematik yang belajar mengecam corak data manusia."

    - slide_no: 4
      title: "Bagaimana AI Berfikir? Ujian Mata AI: Kucing vs Anjing"
      section: "Modul 1: Asas AI"
      visual: "Rajah mudah: 10,000 gambar kucing dimasukkan ke komputer -> AI kenal pasti bentuk telinga, misai, mata -> AI boleh teka gambar baru."
      speaker_notes: "Aktiviti interaktif pentas: Tunjuk gambar anak kucing dan anjing muffin. Minta pelajar angkat tangan teka bagaimana komputer membezakannya."

    - slide_no: 5
      title: "Demonstrasi Langsung 1: Mengarang Cerita & Pantun Bersama AI"
      section: "Modul 1: Demo Interaktif"
      visual: "Skrin projektor memaparkan antara muka ChatGPT / Gemini. Kotak promt terbuka."
      speaker_notes: "Minta seorang wakil pelajar di Meja 1 sebut nama tempat kegemaran mereka (cth: 'Bukit Persekutuan'). Penceramah taip prompt: 'Tulis pantun 4 kerat tentang semangat anak ASDAF Bukit Persekutuan'. Papar hasil serta-merta."

    - slide_no: 6
      title: "Demonstrasi Langsung 2: Imaginasi Visual Menjadi Gambar Digital"
      section: "Modul 1: Demo Interaktif"
      visual: "Penjana imej AI (cth: Canva Magic Media / DALL-E / Bing Creator). Input teks -> Hasil gambar seni 4K."
      speaker_notes: "Minta wakil Meja 4 sebutkan gabungan imaginasi liar: 'Harimau Malaya memakai baju sukan UTM bermain bola sepak di angkasa lepas'. Tunjukkan gambar terjana dalam 5 saat! Dewan teruja."

    - slide_no: 7
      title: "AI Boleh Bantu Kerja Sekolah: Jadual Belajar & Tutor Peribadi"
      section: "Modul 1: Aplikasi Harian"
      visual: "Grafik infografik: Menggunakan AI untuk terangkan formula Matematik sukar, betulkan tatabahasa Bahasa Inggeris, dan buat jadual SPM."
      speaker_notes: "Tekankan prinsip integriti: AI bukan untuk menipu kerja rumah, tetapi sebagai guru tuisyen peribadi yang sabar menjawab soalan berulang kali."

    - slide_no: 8
      title: "Kerjaya Hebat Masa Depan: Di Mana Tempat Anak ASDAF?"
      section: "Modul 1: Kerjaya & Impian"
      visual: "5 Ikon Kerjaya: 1. Pereka Permainan Digital (Game Dev) 2. Pakar AI 3. Penganalisis Keselamatan Siber 4. Jurutera Dron Pertanian 5. Pembangun Aplikasi Web."
      speaker_notes: "Motivasi khas: Bakat teknologi tidak mengira anak bandar atau anak asrama pedalaman. Siapa rajin belajar logik dan celik IT, dunia luas menanti biasiswa dan tawaran kerjaya bergaji tinggi."

    - slide_no: 9
      title: "Dunia Gelap Internet: Scam, Phishing & Jerat Media Sosial"
      section: "Modul 2: Keselamatan Siber"
      visual: "Tangkapan layar mesej WhatsApp palsu: 'Tahniah! Anda memenangi RM10,000 dari Shopee, sila klik pautan ini sekarang'."
      speaker_notes: "Tanya: 'Siapa pernah terima mesej macam ni?'. Jelaskan ini adalah pancingan data (phishing) yang berniat mencuri akaun dan duit keluarga."

    - slide_no: 10
      title: "Formula Emas 3T: Senjata Utama Melawan Scammer"
      section: "Modul 2: Keselamatan Siber"
      visual: "Grafik Besar T-T-T: 1. TIDAK PASTI 2. TIDAK KONGSI 3. TIDAK KLIK. Lencana NSRC Hotline 997."
      speaker_notes: "Ajak semua dewan sebut beramai-ramai: 'TIDAK PASTI, TIDAK KONGSI, TIDAK KLIK!'. Hafal talian Pusat Respons Scam Kebangsaan 997."

    - slide_no: 11
      title: "Rahsia Kata Laluan Kebal: Password vs Passphrase"
      section: "Modul 2: Keselamatan Siber"
      visual: "Perbandingan: 'kucing123' (mudah digodam dalam 2 saat) vs 'HarimauLompatPagar99!' (perlu 10,000 tahun untuk dipecahkan)."
      speaker_notes: "Ajar teknik gabung 3 perkataan rawak menjadi ayat rahsia yang mudah diingat pemilik tetapi mustahil diteka oleh penggodam."

    - slide_no: 12
      title: "Jejak Digital & Maruah Diri: Internet Tidak Pernah Lupa"
      section: "Modul 2: Etika Digital"
      visual: "Ilustrasi cap kaki digital bercahaya. Catatan media sosial, komen toksik, gambar peribadi yang tersebar."
      speaker_notes: "Peringatan empati: Jaga aib dan maruah diri di TikTok/Instagram. Apa yang dimuat naik hari ini boleh dilihat oleh majikan atau penemuduga universiti 5 tahun lagi."

    - slide_no: 13
      title: "Masa untuk Menjadi Pencipta: Bengkel Startup Sprint Kertas Mahjong"
      section: "Modul 2: Latihan Kumpulan"
      visual: "Gambar susun atur 7 meja kluster, gulungan kertas mahjong, marker pelbagai warna, pelekat sticky notes."
      speaker_notes: "Umumkan aktiviti kemuncak: Meja korang kini adalah syarikat teknologi! Cipta 1 idea inovasi untuk bantu asrama/sekolah anda."

    - slide_no: 14
      title: "Format Pembentangan Poster: 4 Kotak Emas"
      section: "Modul 2: Panduan Poster"
      visual: "Rajah susun atur kertas mahjong: 1. Nama Inovasi & Logo 2. Masalah Yang Dihadapi 3. Bagaimana Teknologi AI Berfungsi 4. Kebaikan Kepada Komuniti."
      speaker_notes: "Fasilitator meja bersedia membantu pelajar membahagikan kertas mahjong kepada 4 kuadran ringkas dan menarik."

    - slide_no: 15
      title: "Bersiap Sedia: Fast-Answer Tech Showdown Kuiz Pantas!"
      section: "Kuiz Dewan"
      visual: "Layar pertarungan arcade retro, kiraan detik '3... 2... 1... ANGKAT TANGAN!'. Gambar hadiah misteri."
      speaker_notes: "Pemanas suasana kuiz: Tangan atas meja, mata pada skrin! Siapa terpantas dan tepat, terus sapu hadiah di hadapan pentas."

    - slide_no: 16
      title: "Masa Depan Bermula Hari Ini! Terima Kasih ASDAF"
      section: "Penutup"
      visual: "Ucapan penghargaan rasmi UTM kepada ASDAF PERKIM, sesi bergambar & serahan cenderamata."
      speaker_notes: "Kata-kata penutup inspirasi: 'Korang adalah generasi peneraju teknologi negara. Jangan pernah rasa rendah diri, buktikan kemampuan anak ASDAF!'."

workshop_activities:
  - id: "AKT-01"
    name: "Sesi Ice Breaking: Guess the App, Teka Emoji & Tech Charades"
    time_slot: "09:00 - 09:15 (15 Minit)"
    phase: "Pembukaan & Suai Kenal"
    target: "Semua 47 Pelajar ASDAF + 13 Kru UTM (7 Meja Kluster)"
    materials:
      - "Slaid Visual Projektor (Logo Zoom-In & Emoji Puzzle)"
      - "7 Set Flashcard Emoji Meja"
      - "Wisel & Snek Token Mesra"
    mechanics:
      - "Pusingan 1 (5 Minit): Guess the App — Gambar logo aplikasi (YouTube, TikTok, Roblox, Canva) dizoom masuk di layar skrin. Meja paling pantas angkat tangan meneka."
      - "Pusingan 2 (5 Minit): Teka Emoji Teknologi — Gabungan emoji dipaparkan (cth: 🧠+💻 = AI; 📱+🔒 = Kata Laluan; 🎣+📧 = Scam). Murid meneka maksud tersembunyi."
      - "Pusingan 3 (5 Minit): Tech Charades Spontan — Mentor meja membuat gaya bisu aksi teknologi (main game VR, robot sapu lantai, menaip laju); pelajar meja teka aksi tersebut."
    mentor_role: "Menceriakan suasana meja, memberi petunjuk lembut kepada adik-adik Tingkatan 1, dan memberi peluang kepada 4 murid PPKI mengangkat flashcard jawapan."

  - id: "AKT-02"
    name: "Teknologi Talk: “Teknologi di Sekeliling Kita” & Demonstrasi Langsung AI"
    time_slot: "09:15 - 09:35 (20 Minit)"
    phase: "Modul 1: Talk Santai & Pendedahan"
    target: "Seluruh Dewan (47 Pelajar & Staf ASDAF)"
    materials:
      - "Komputer Riba Utama & Projektor Skrin Dewan"
      - "Aplikasi Penjana AI Langsung (ChatGPT & Image Generator Canva/Bing)"
      - "Mikrofon Wayarles Dewan"
    mechanics:
      - "Penceramah menerangkan konsep AI, telefon pintar, robot dan algoritma menggunakan analogi mudah 'kawan yang membaca sejuta buku'."
      - "Ujian Penglihatan Komputer: Membandingkan gambar anak kucing, anak anjing dan kek muffin di skrin."
      - "Live Demo 1: Menjana pantun 4 kerat bertemakan anak ASDAF secara spontan melalui ChatGPT."
      - "Live Demo 2: Menjana gambar digital 4K daripada cadangan imaginasi liar pelajar (cth: Harimau Malaya bermain bola di angkasa)."
      - "Pendedahan 5 kerjaya hebat masa depan dalam bidang teknologi."
    mentor_role: "Duduk bersama pelajar di meja, membimbing perhatian murid junior, dan mengulang contoh mudah jika ada murid bertanya di meja."

  - id: "AKT-03"
    name: "Cabaran Kuiz Teknologi: Gaya Kahoot Layar Skrin (Sifar Gajet)"
    time_slot: "09:35 - 10:00 (25 Minit)"
    phase: "Modul 1: Peneguhan & Kuiz Interaktif"
    target: "7 Kumpulan Meja Kluster"
    materials:
      - "Kad Warna Pilihan Jawapan A (Merah), B (Biru), C (Kuning), D (Hijau) per Meja"
      - "Layar Projektor Soalan Kuiz & Muzik Latar Countdown"
      - "Papan Markah Dewan (Flipchart)"
      - "5 Hadiah Cenderahati Pemenang Pantas"
    mechanics:
      - "Soalan kuiz dipaparkan di skrin besar selama 30 saat bersama muzik rancak countdown."
      - "Ahli meja berbincang selama 15 saat bersama mentor untuk memilih jawapan terbaik."
      - "Kiraan detik emcee: 'Tiga... Dua... Satu... ANGKAT KAD!'. Semua meja serentak mengangkat kad warna A/B/C/D."
      - "Jawapan betul disahkan di skrin. Markah dicatat di papan skor dewan; meja terpantas menerima token hadiah serta-merta."
    mentor_role: "Membantu pelajar berbincang secara demokratik di meja. Melantik murid PPKI sebagai pemegang kad rasmi meja untuk mengangkat kad."

  - id: "AKT-04"
    name: "Sesi “Bijak Melayari Internet”: Bedah Siasat Scam & Password Kebal"
    time_slot: "10:15 - 10:45 (30 Minit)"
    phase: "Modul 2: Keselamatan Siber & Etika"
    target: "Seluruh Dewan & 7 Meja Kluster"
    materials:
      - "Slaid Paparan Visual Contoh Mesej Scam Sebenar (SMS / WhatsApp / Jerat Game)"
      - "Infografik Formula 3T (Tidak Pasti, Tidak Kongsi, Tidak Klik)"
      - "Poster Talian Bantuan Pusat Respons Scam Kebangsaan (NSRC 997)"
    mechanics:
      - "Penceramah memaparkan tangkapan layar mesej tipu daya sebenar dan meminta dewan mencari 3 tanda amaran (red flags)."
      - "Latihan Sebut Beramai-ramai: Laungan Slogan Formula Emas 3T dan hafalan nombor hotline 997."
      - "Bengkel Mini Password Kebal: Membezakan kata laluan lemah (kucing123) dan mencipta 'Passphrase Kebal' (gabungan 3 perkataan rawak unik)."
      - "Peringatan Jejak Digital: Menjaga maruah dan batas peribadi di media sosial (TikTok/Instagram)."
    mentor_role: "Memeriksa contoh kata laluan yang dicuba oleh pelajar di kertas nota dan mengingatkan mereka agar jangan berkongsi nombor telefon ibu bapa secara terbuka."

  - id: "AKT-05"
    name: "Aktiviti Amali Teknologi: Startup Sprint Kertas Mahjong & Pembentangan"
    time_slot: "10:45 - 11:50 (65 Minit)"
    phase: "Modul 2: Amali Kreatif & Pentas Pitching"
    target: "7 Kumpulan Meja Kluster (6-7 Murid per Meja)"
    materials:
      - "7 Keping Kertas Mahjong Putih Tebal"
      - "Set Marker Pen Pelbagai Warna (Hitam, Biru, Merah) per meja"
      - "1 Pad Sticky Notes Neon & Pelekat Dot Undian per meja"
      - "Pita Pelekat Kertas / Masking Tape"
    table_themes:
      - table_id: 1
        name: "Meja 1 (Junior Lelaki + PPKI)"
        theme: "Robot Pembersih Asrama Pintar"
        desc: "Lakaran mesin automatik menyapu dorm, mengutip sampah, dan menyembur wangian segar."
      - table_id: 2
        name: "Meja 2 (Junior Lelaki)"
        theme: "Loceng & Penggera Jadual Solat/Prep Pintar"
        desc: "Alat penggera peringatan waktu subuh dan sesi prep malam dengan lampu LED berirama."
      - table_id: 3
        name: "Meja 3 (Senior Lelaki)"
        theme: "Dron Pemantau Keselamatan Dusun & Hutan"
        desc: "Dron berkuasa solar mengesan ancaman haiwan liar atau penceroboh di kawasan dusun pedalaman."
      - table_id: 4
        name: "Meja 4 (Junior Perempuan + PPKI)"
        theme: "Gelang Pengesan Keselamatan Remaja (SOS GPS)"
        desc: "Gelang tangan dengan butang amaran kecemasan GPS dan lampu siren jika berada dalam bahaya."
      - table_id: 5
        name: "Meja 5 (Menengah Rendah Perempuan + PPKI)"
        theme: "Kamera Penterjemah Bahasa Temiar/Semai ke BM"
        desc: "Aplikasi AI mendengar percakapan bahasa ibunda suku kaum dan menterjemah teks secara langsung."
      - table_id: 6
        name: "Meja 6 (Menengah Atas Perempuan + PPKI)"
        theme: "Aplikasi Sahabat Minda & Luahan Perasaan Asrama"
        desc: "Ruang digital selamat tanpa nama untuk meluahkan stres peperiksaan dan menerima kata semangat."
      - table_id: 7
        name: "Meja 7 (Senior SPM Perempuan)"
        theme: "Portal Kerjaya & Biasiswa TVET/IT Masa Depan"
        desc: "Sistem padanan minat kerjaya dengan kolej kemahiran, biasiswa zakat, dan kemasukan universiti."
    mechanics:
      - "Fasa 1 (10:45 – 11:00 | 15 Minit): Taklimat 4 Kuadran Emas (Nama & Logo, Masalah, Fungsi AI, Kebaikan). Sumbang saran idea guna sticky notes neon."
      - "Fasa 2 (11:00 – 11:30 | 30 Minit): Melukis prototaip alatan pada kertas mahjong, menulis poin penting dengan marker, dan latihan pembentangan."
      - "Fasa 3 (11:30 – 11:50 | 20 Minit): Cabaran Pembentangan Pentas. Wakil setiap meja ke hadapan membentangkan idea selama 2 minit diiringi mentor."
    mentor_role: "Memandu agihan tugas (siapa pelukis, siapa penulis, siapa jurucakap), memastikan murid PPKI memegang marker warna atau menampal pelekat, dan mengiringi pembentang ke pentas."

ppki_inclusion_guidelines:
  title: "Panduan Bimbingan Mesra Murid Pendidikan Khas (PPKI)"
  target_students: "4 Orang Pelajar PPKI (Di Meja 1, Meja 4, Meja 5, dan Meja 6)"
  strategies:
    - strategy: "Peranan Fizikal & Kinestetik Nyata"
      desc: "Beri mereka tugas seperti memegang pen marker warna kegemaran, memilih warna sticky notes, menggunting lembaran gambar, dan menampal pelekat undian pada poster."
    - strategy: "Bahasa Mudah & Arahan Satu Demi Satu"
      desc: "Elakkan istilah teori yang rumit. Terangkan konsep melalui analogi harian seperti 'alat ini macam peti sejuk pintar yang tahu apa makanan ada di dalam'."
    - strategy: "Pujian Positif Spontan (Positive Reinforcement)"
      desc: "Ucapkan 'Bagus adik!', 'Hebat lukisan ini!' untuk membina keyakinan diri dan perasaan dihargai sepanjang program."
    - strategy: "Sokongan Rapat Tanpa Mengasingkan"
      desc: "Mentor meja duduk bersebelahan murid PPKI sambil memastikan rakan meja sebaya lain turut menyantuni dan melibatkan mereka dalam perbincangan."

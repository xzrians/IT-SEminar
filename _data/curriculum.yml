        - "Pita Pelekat Kertas (Masking Tape)"
      run_of_show:
        - time: "10:45 – 10:55"
          phase: "Taklimat 4 Kuadran Emas & Agihan Tema"
          stage: "Penceramah terangkan format 4 Kotak Emas di layar projektor. Umumkan 7 meja kini adalah 7 syarikat teknologi muda."
          table: "Buka kertas mahjong di tengah meja, lekatkan 4 bucu dengan masking tape. Agihkan marker pen."
          av: "Paparkan Slaid 13 & 14."
        - time: "10:55 – 11:15"
          phase: "Melukis Prototaip & Sumbang Saran"
          stage: "Emcee pusing ke meja-meja memberi kata dorongan. Muzik latar kerja kumpulan rancak."
          table: "Bimbing lakaran prototaip di Kotak 3 dan tajuk logo di Kotak 1. Murid PPKI melukis butang dan mewarna tajuk."
          av: "Mainkan muzik lofi fokus berterusan."
        - time: "11:15 – 11:30"
          phase: "Menulis Poin Manfaat & Raptai Pitching"
          stage: "Peringatan masa: 15 minit terakhir sebelum pembentangan. Siapkan Kotak 2 (Masalah) dan Kotak 4 (Kebaikan)."
          table: "Pilih jurucakap pentas dan adakan raptai skrip pembentangan 2 minit di meja."
          av: "Loceng amaran masa 5 minit terakhir."
        - time: "11:30 – 11:50"
          phase: "Pentas Pembentangan NextGen (2 Minit/Meja)"
          stage: "7 Meja bergilir naik ke pentas (2 minit per meja). Emcee kendalikan loceng masa dan pimpin sorakan gemuruh."
          table: "Semua ahli meja naik bersama ke hadapan pentas. Murid PPKI dan rakan junior memegang poster mahjong."
          av: "Kesan bunyi drumroll dan loceng tamat 2 minit."
      verbatim_script:
        role: "Templat Pitching 2 Minit Pelajar"
        text: "Assalamualaikum dan salam sejahtera! Kami dari Syarikat Meja [X]! Nama ciptaan kami ialah [Nama Inovasi]! Masalah di asrama yang kami nak selesaikan ialah [Masalah Ringkas]. Alat kami berfungsi dengan cara [Terangkan Prototaip]. Kebaikannya asrama kami jadi lebih selamat dan ceria! Terima kasih!"
      ppki_role: "Murid PPKI bertindak sebagai Ketua Artis & Pemegang Poster Pentas. Di meja mereka melukis butang sensor alat dengan marker warna. Di pentas, mereka memegang poster di hadapan dewan dengan bangga."
      contingency: "Jika masa terlajak 5 minit, pendekkan masa pembentangan kepada 1 minit 30 saat per meja. Mentor berdiri di sebelah mikrofon membantu jika murid gugup."

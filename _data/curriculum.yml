      ppki_role: "Murid PPKI dilantik sebagai pemegang kad rasmi meja. Apabila ahli meja bersetuju dengan pilihan warna, murid PPKI mengangkat kad tersebut tinggi-tinggi ke udara."
      contingency: "Jika berlaku keputusan seri antara 2 meja di puncak papan markah, jalankan 'Sudden Death Bonus Question' (Soalan nombor hotline NSRC 997)."

    - id: "sesi-4"
      title: "Sesi 4: Sesi “Bijak Melayari Internet”"
      time: "10:15 – 10:45 (30 Minit)"
      tag: "Keselamatan Siber & Etika"
      tag_color: "emerald"

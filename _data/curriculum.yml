      materials:
        - "Slaid Paparan Tangkapan Layar Mesej Scam Sebenar"
        - "Kertas Nota Lakaran Kata Laluan"
        - "Infografik 3T & Poster Hotline 997"
      run_of_show:
        - time: "10:15 – 10:22"
          phase: "Bedah Siasat Mesej Scam Sebenar"
          stage: "Paparkan contoh tangkapan layar WhatsApp/SMS palsu menang RM10,000. Uji dewan kenal pasti 3 tanda amaran (red flags)."
          table: "Tunjuk pautan pelik '.xyz' pada slaid kepada murid meja."
          av: "Paparkan Slaid 9."
        - time: "10:22 – 10:28"
          phase: "Formula Emas 3T & Hotline 997"
          stage: "Laungkan formula 3T beramai-ramai: 'TIDAK PASTI, TIDAK KONGSI, TIDAK KLIK!' dan hafalan nombor kecemasan 997."
          table: "Pimpin meja berdiri melaungkan 3T dengan gaya tangan perisai."
          av: "Paparkan Slaid 10."
        - time: "10:28 – 10:38"
          phase: "Bengkel Kata Laluan Kebal (Passphrase)"
          stage: "Ajar beza kata laluan lemah (kucing123: 0.2 saat) vs Passphrase 3 perkataan rawak (10,000 tahun). Cabar bina ayat kebal."
          table: "Bimbing setiap murid menulis 1 ayat passphrase kelakar unik pada kertas nota masing-masing."
          av: "Paparkan Slaid 11."
        - time: "10:38 – 10:45"
          phase: "Jejak Digital & Maruah Remaja"
          stage: "Peringatan empati: Internet tidak pernah lupa jejak digital kita. Jangan sebar aib kawan dan hentikan buli siber."
          table: "Ingatkan pelajar agar saling melindungi maruah rakan satu asrama."
          av: "Paparkan Slaid 12."
      verbatim_script:
        role: "Trainer Keselamatan Siber (Kru 2)"
        text: "Scammer zaman moden tak pakai topeng hitam bawa pistol. Mereka hantar mesej manis: 'Tahniah adik menang RM10,000!'. Jangan sesekali klik! Ingat formula 3T: Tidak Pasti, Tidak Kongsi, Tidak Klik! Kalau akaun kena tipu, telefon hotline 997 segera!"
      ppki_role: "Mentor Meja 1, 4, 5, 6 bantu murid PPKI menyusun 3 perkataan bergambar yang mudah diingat seperti 'KucingLompatTinggi!' pada kertas nota."
      contingency: "Jika masa suntuk, pendekkan sesi perbincangan kertas nota kepada 3 minit dan minta 2 orang wakil pelajar membaca passphrase mereka di mikrofon."

    - id: "sesi-5"

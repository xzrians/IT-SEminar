utilities_and_supplies:
  title: "Senarai Utiliti & Alatan Aktiviti Lengkap (7 Meja + Dewan)"
  purpose: "Keperluan logistik fizikal untuk kelancaran aktiviti interaktif tanpa telefon dan kawalan pengurusan dewan."
  categories:
    - category: "Alatan Aktiviti 7 Meja Kluster (Bilik Darjah)"
      icon: "layout-grid"
      items:
        - name: "Kertas Mahjong Putih"
          qty: "2 keping x 7 kumpulan + 4 simpanan = 18 keping"
          purpose: "Setiap kumpulan guna 2 keping untuk lakaran idea inovasi; 4 keping tambahan untuk papan skor/simpanan."
        - name: "Pen Marker Pelbagai Warna (Chisel/Bullet Tip)"
          qty: "2 batang x 7 kumpulan + 4 simpanan = 18 batang"
          purpose: "Setiap kumpulan guna 2 marker (gelap + warna cerah) untuk tulisan jelas; 4 batang tambahan untuk kru."
        - name: "Sticky Notes Neon (Pelbagai Warna)"
          qty: "1 pad x 7 kumpulan + 3 simpanan = 10 pad"
          purpose: "1 pad untuk setiap kumpulan bagi sesi sumbang saran idea pantas, dengan 3 pad sebagai stok gantian."
        - name: "Masking Tape Kertas"
          qty: "2 gulung (1 gulung untuk 3-4 kumpulan)"
          purpose: "Menampal kertas mahjong hasil kerja pelajar di dinding tanpa merosakkan cat dewan asrama."
        - name: "Gunting Keselamatan Kanak-Kanak"
          qty: "1 unit x 7 kumpulan = 7 unit"
          purpose: "Setiap kumpulan menerima 1 unit untuk memotong bahan aktiviti dengan selamat (hujung bulat tumpul)."
        - name: "Gam Stick UHU / Kertas"
          qty: "1 unit x 7 kumpulan = 7 unit"
          purpose: "Setiap kumpulan menerima 1 gam stick untuk menampal lembaran idea atau gambar ke atas kertas mahjong."
        - name: "Borang Survey Pre & Post (Cetakan)"
          qty: "50 set pre + 50 set post = 100 helaian"
          purpose: "Borang ringkas untuk ukur impak sebelum/selepas program dan mudah dicetak hitam putih."
        - name: "Pelekat Bulat Warna (Voting Dot Stickers)"
          qty: "2 helaian (100 dot)"
          purpose: "Pelajar mengundi idea kumpulan paling kreatif (setiap pelajar diberi 2 pelekat undian)."

    - category: "Pengurusan Pentas, Kuiz & Pentadbiran"
      icon: "monitor"
      items:
        - name: "Papan Skor Kuiz Dewan (Showdown Board)"
          qty: "1 set"
          purpose: "Kad angka markah / whiteboard mudah alih untuk catat markah pantas Meja 1 hingga 7."
        - name: "Tag Nama / Lanyard Kertas Lipat"
          qty: "55 unit"
          purpose: "Label nama pelajar mengikut meja (Meja 1 - 7) untuk memudahkan mentor memanggil nama."
        - name: "Bateri Gantian AV (AA & AAA)"
          qty: "4x AA + 2x AAA"
          purpose: "Bateri sandaran untuk 2 mikrofon wayarles dewan dan wireless presenter/clicker."
        - name: "Kabel Sambungan HDMI & Extension Plug (Penyambung Soket)"
          qty: "1x HDMI + 1x Multi-Plug 5m"
          purpose: "Menyambungkan laptop penceramah/AV ke projektor dewan ASDAF tanpa gangguan."

    - category: "Kebersihan, Hospitaliti & Kecemasan"
      icon: "sparkles"
      items:
        - name: "Plastik Sampah Hitam Saiz XL (Heavy Duty)"
          qty: "5 unit"
          purpose: "1 unit setiap sudut dewan & meja makan untuk pembersihan pantas selepas jamuan."
        - name: "Tisu Basah Antiseptik & Tisu Kering"
          qty: "2 pek basah + 2 kotak tisu"
          purpose: "Kebersihan tangan sebelum makan snek dan mengelap meja aktiviti."
        - name: "Kit Pertolongan Cemas Asas (First Aid)"
          qty: "1 kit ringkas"
          purpose: "Plaster luka, minyak angin dan antiseptic wipes untuk kontingensi murid."

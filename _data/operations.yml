# Pelan Operasi Terperinci: Dokumen, Makanan, Goodies & Utiliti Aktiviti

documentation_distribution:
  title: "Pek Dokumen Pelajar Tidak Hadir & Pengurusan ASDAF"
  purpose: "Memastikan pelajar yang tidak dapat hadir (sakit, kuarantin, urusan asrama) tetap menerima manfaat modul celik digital, serta penyerahan rekod rasmi kepada pihak pengurusan ASDAF."
  target_copies: "10-15 Pek Simpanan Fizikal + Kit Digital Warden"
  items:
    - name: "Modul Infografik Celik Digital & AI (A4 Berwarna)"
      format: "Bercetak (Booklet Ringkas 4 Muka Surat)"
      desc: "Ringkasan Modul 1 (Pengenalan AI & Prompting) dan Modul 2 (Keselamatan Siber, Jejak Digital & Formula Scam 3T)."
      recipient: "Pelajar tidak hadir & arkib rujukan perpustakaan asrama"
      pic: "AJK Dokumentasi UTM"

    - name: "Lembaran Aktiviti 'Tech Bingo' & 'Lakaran Inovasi'"
      format: "Bercetak (2 Helaian Tugasan Fizikal)"
      desc: "Aktiviti kendiri yang boleh dilengkapkan di asrama secara santai bersama rakan sebaya atau warden."
      recipient: "Pelajar tidak hadir"
      pic: "Lead Trainer AI"

    - name: "Kad Panduan Pantas Keselamatan Siber (Pocket Card / Bookmark)"
      format: "Kad Mini Laminasi Berwarna"
      desc: "Panduan tips kata laluan kebal, senarai semak pautan palsu, dan nombor hotline kecemasan siber kebangsaan (NSRC 997)."
      recipient: "Semua 46 pelajar & edaran tambahan"
      pic: "AJK Dokumentasi UTM"

    - name: "Sijil Penyertaan Bertulis Nama (Pek Khas)"
      format: "Sijil Fizikal Rasmi Emboss"
      desc: "Sijil disimpan dalam sampul khas bertanda nama pelajar untuk diserahkan oleh warden selepas murid menyiapkan lembaran modul."
      recipient: "Pelajar tidak hadir (diserahkan kepada Warden)"
      pic: "Pengurus Hadiah & Sijil"

    - name: "Kit Digital ASDAF (Google Drive / Kod QR)"
      format: "Folder Awan + Kad Kod QR Bercetak"
      desc: "Mengandungi slaid pembentangan lengkap (PDF), video demonstrasi AI, e-modul, dan senarai alatan web percuma untuk kemudahan komputer asrama."
      recipient: "Pengurusan & Warden ASDAF"
      pic: "Lead Teknikal UTM"

    - name: "Borang Survey Gabungan Pre & Post (1 Helaian A4 Lengkap)"
      format: "Bercetak 1 Muka (A4 Single-Sheet: Pre di atas, Post & Komen di bawah)"
      desc: "1 helaian A4 lengkap tanpa dipotong: Bahagian Atas = Pre-Survey (08:45 AM), Bahagian Bawah = Post-Survey & Ruangan Komen/Maklum Balas (12:45 PM). Pelajar menyimpan kertas yang sama untuk perbandingan impak celik digital, keselamatan siber, dan berkongsi ulasan bertulis."
      recipient: "46 Pelajar ASDAF + 4 simpanan (Jumlah: 50 keping A4)"
      pic: "AJK Dokumentasi UTM"

food_logistics:
  title: "Logistik Makanan: Roti & Air Kotak (Semua Pax + 5 Lebihan)"
  formula: "65 Pax Asas (46 Pelajar + 6 Staf + 13 Pelajar UTM) + 5 Pax Penampan (Buffer) = 70 Pax Keseluruhan"
  target_pax: 70
  menu: "Roti Bun Manis / Inti Berkualiti + Air Kotak 250ml"
  options:
    - option_name: "Pilihan Utama: Tempahan Kantin Sekolah / Asrama ASDAF"
      type: "Kantin Asrama"
      pros: "Makanan dijamin panas/segar, tiada isu kelewatan trafik, menyokong peniaga premis asrama, waktu hidang fleksibel tepat jam 10:00 AM."
      cons: "Perlu pengesahan menu 3 hari awal bersama pengusaha kantin."
      est_cost_per_pax: "RM 2.50 - RM 3.00"
      total_est: "RM 175.00 - RM 210.00 (70 Pax)"
      pic: "AJK Jamuan UTM berhubung terus dengan Pengurusan ASDAF"

    - option_name: "Pilihan Alternatif: Pembelian Runcit Luar / Bakeri Borong"
      type: "Pembekal Luar"
      pros: "Pilihan jenama terjamin (Gardenia / Mighty White + Air Kotak Dutch Lady/Yeo's 250ml), jangka hayat luput lebih lama, sedia awal sebelum hari kejadian."
      cons: "Perlu ruang logistik pengangkutan dalam kereta kru UTM ke Bukit Persekutuan pagi acara."
      est_cost_per_pax: "RM 2.30 - RM 2.60 (Roti RM1.10-RM1.30 + Air Kotak RM1.20-RM1.30)"
      total_est: "RM 161.00 - RM 182.00 (70 Pax)"
      pic: "AJK Logistik UTM (Beli di pasar raya borong H-1)"


- time: "08:30 - 09:00"
  duration: "30 min"
  title: "Pendaftaran, Sarapan & Taklimat Awal"
  tag: "Persediaan"
  tag_color: "blue"
  desc: "Ketibaan kru UTM di ASDAF Bukit Persekutuan, susun atur 7 meja kluster, pengujian projektor & mikrofon, serta agihan 'lanyard/sticker nama' kepada 47 pelajar mengikut meja."
  pic: "Semua Kru UTM & Staf ASDAF"

- time: "09:00 - 09:20"
  duration: "20 min"
  title: "Majlis Pembukaan & Ice-Breaking 'Tech Bingo'"
  tag: "Pengenalan"
  tag_color: "cyan"
  desc: "Ucapan pembukaan oleh Pengarah Projek & wakil pentadbiran ASDAF. Aktiviti fizikal pantas 'Tech Bingo' tanpa gajet untuk mengeratkan ukhuwah 7 meja bersama mentor."
  pic: "Pengarah Projek & 7 Mentor Meja"

- time: "09:20 - 10:20"
  duration: "60 min"
  title: "Modul 1: Dunia Kecerdasan Buatan (AI) & Masa Depan Kerjaya"
  tag: "Modul Teras"
  tag_color: "purple"
  desc: "Pengenalan AI interaktif melalui layar projektor: bagaimana AI mengenali imej, menghasilkan teks, dan menyelesaikan masalah harian. Pendedahan laluan kerjaya digital & motivasi SPM."
  pic: "Lead Trainer AI & AV Team"

- time: "10:20 - 10:45"
  duration: "25 min"
  title: "Rehat Minda & Jamuan Ringan"
  tag: "Rehat"
  tag_color: "amber"
  desc: "Rehat 25 minit. Kudapan pagi disediakan untuk 47 pelajar, 6 staf ASDAF, dan 13 kru UTM. Sesi perbualan santai mentor-pelajar di meja."
  pic: "AJK Jamuan & Logistik"

- time: "10:45 - 11:45"
  duration: "60 min"
  title: "Modul 2: Keselamatan Siber & Pembina Masa Depan"
  tag: "Aktiviti Kumpulan"
  tag_color: "green"
  desc: "Simulasi senario ancaman siber (scam, phising, jejak digital). Aktiviti 'Design Inovasi Digital' atas kertas manila dan kad idea dibimbing oleh mentor meja."
  pic: "Trainer 2 & 7 Mentor Meja"

- time: "11:45 - 12:15"
  duration: "30 min"
  title: "Fast-Answer Tech Showdown (Kuiz Tanpa Telefon)"
  tag: "Kuiz Interaktif"
  tag_color: "rose"
  desc: "Pertarungan pantas 5 soalan berasaskan '3, 2, 1... Angkat Tangan!'. Papan markah langsung di hadapan dewan. Pemenang menerima hadiah saguhati segera."
  pic: "Emcee, Scorekeeper & Prize Lead"

- time: "12:15 - 12:45"
  duration: "30 min"
  title: "Majlis Penutup, Penyampaian Hadiah & Cenderahati ASDAF"
  tag: "Penutup"
  tag_color: "purple"
  desc: "Penyampaian sijil penyertaan, hadiah pemenang kuiz, plak penghargaan kepada ASDAF PERKIM, dan sesi bergambar beramai-ramai."
  pic: "Pengarah Projek & Pengurus Hadiah"

- time: "12:45 - 13:00"
  duration: "15 min"
  title: "Makan Tengah Hari & Bersurai"
  tag: "Selesai"
  tag_color: "blue"
  desc: "Pengagihan pek makan tengah hari (jika Varian 3) / pek buah & doorgift, pembersihan dewan bersama staf ASDAF, dan bersurai."
  pic: "AJK Kebersihan & Semua Kru"

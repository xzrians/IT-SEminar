pedagogical_rules:
  - rule: "Sifar Keperluan Gajet (Zero-Device Requirement)"
    desc: "Pelajar asrama tidak dibenarkan membawa telefon pintar peribadi. Tiada aplikasi digital seperti Kahoot/Quizizz digunakan; diganti dengan Fast-Answer Showdown di layar skrin."
  - rule: "Nisbah Bimbingan Rapat (1:6 Mentor-to-Student Ratio)"
    desc: "13 kru dibahagikan di mana 7 mentor duduk bersama di setiap meja untuk memastikan tiada pelajar terpinggir, terutamanya murid PPKI."
  - rule: "Pendedahan Realistik & Visual Terus"
    desc: "Penceramah menggunakan skrin projektor pusat untuk mendemonstrasi AI dan alatan percuma, manakala mentor membimbing interaksi fizikal di meja."
  - rule: "Inklusiviti & Nilai Kasih Sayang"
    desc: "Pendekatan empati tinggi menghormati latar belakang anak yatim dan asnaf, menekankan motivasi masa depan dan peluang dunia digital terbuka luas."

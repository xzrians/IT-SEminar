central_leads:
  - id: 1
    role: "Pengarah Projek & Lead Emcee"
    category: "Kepimpinan"
    badge: "Stage Lead"
    scope: "Menyelaras keseluruhan program, ucapan pembukaan, kawalan pentas dewan, dan protokol bersama warden ASDAF."
    tag_color: "cyan"

  - id: 2
    role: "Penceramah AI & Lead Trainer"
    category: "Modul & Kandungan"
    badge: "Speaker"
    scope: "Menyampaikan Modul 1 & Modul 2, demonstrasi AI di layar besar, dan memimpin dinamika soalan kuiz."
    tag_color: "purple"

  - id: 3
    role: "Lead Teknikal, AV & Projektor"
    category: "Teknikal"
    badge: "AV & IT"
    scope: "Mengurus sistem siar raya (PA system), mikrofon wayarles, sambungan projektor HDMI, dan paparan slaid."
    tag_color: "blue"

  - id: 4
    role: "Pengurus Masa & Skor Kuiz (Scorekeeper)"
    category: "Operasi"
    badge: "Stage Support"
    scope: "Menjaga ketepatan masa mengikut jadual minit-ke-minit, mengira markah 'Fast-Answer Showdown' di hadapan dewan."
    tag_color: "amber"

  - id: 5
    role: "Pengurus Hadiah, Cenderahati & Sijil"
    category: "Protokol"
    badge: "Logistik"
    scope: "Menyusun hadiah pemenang kuiz, plak cenderahati pengetua ASDAF, dan 47 sijil penyertaan pelajar."
    tag_color: "rose"

  - id: 6
    role: "Pengurus Jamuan, Kebersihan & Keselamatan"
    category: "Logistik"
    badge: "Hospitaliti"
    scope: "Menyelaras hidangan kudapan pagi dan makan tengah hari (66 pax), memastikan keselamatan dan kebersihan dewan."
    tag_color: "green"


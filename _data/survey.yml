pre:
  tag: "BAHAGIAN 1"
  code: "PRE-SURVEY"
  title: "Soal Selidik Pra-Program (Sebelum Seminar)"
  timing: "Diisi pada permulaan sesi taklimat (08:45 AM)"
  instruction: "Tandakan (✓) pada satu nombor bagi setiap kenyataan sebelum seminar bermula:"
  questions:
    - id: 1
      text: "Saya faham apa itu AI (Kecerdasan Buatan) dan fungsinya dalam kehidupan harian."
    - id: 2
      text: "Saya tahu cara mengenal pasti scam, pancingan data (phishing), dan pautan palsu."
    - id: 3
      text: "Saya sedar apa itu jejak digital (digital footprint) dan kesannya terhadap masa depan."
    - id: 4
      text: "Saya berasa yakin menggunakan internet dan media sosial secara selamat."
    - id: 5
      text: "Saya berminat untuk meneroka bidang teknologi maklumat dan kerjaya digital."
  open_prompt: "Harapan / Apa yang paling anda ingin pelajari hari ini?"

divider_text: "BAHAGIAN 2: SELEPAS PROGRAM (POST-SURVEY & MAKLUM BALAS)"

post:
  tag: "BAHAGIAN 2"
  code: "POST-SURVEY"
  title: "Soal Selidik Pasca-Program & Maklum Balas (Selepas Seminar)"
  timing: "Diisi pada akhir seminar sebelum jamuan makan & bersurai (12:45 PM)"
  instruction: "Tandakan (✓) pada satu nombor bagi setiap kenyataan mengikut pengalaman anda hari ini:"
  questions:
    - id: 1
      text: "Selepas program ini, saya lebih faham cara AI berfungsi dan aplikasinya."
    - id: 2
      text: "Selepas program ini, saya lebih berwaspada dan tahu cara mengelak scam/phishing."
    - id: 3
      text: "Saya lebih prihatin untuk menjaga reputasi dan keselamatan jejak digital saya."
    - id: 4
      text: "Saya kini yakin untuk mengamalkan langkah keselamatan akaun & kata laluan kukuh."
    - id: 5
      text: "Program ini meningkatkan minat saya untuk mendalami kemahiran & kerjaya digital."
  open_prompt: "Ruangan Komen & Maklum Balas Pelajar: Tulis pandangan anda tentang program ini dan apa yang boleh ditambah baik:"
